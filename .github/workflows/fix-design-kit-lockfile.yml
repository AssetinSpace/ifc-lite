# ONE-SHOT, THROWAWAY. Delete this file (and its branch) once it has run.
#
# Why it exists: `@assetinspace/design-kit` is declared with the `github:`
# shorthand, which pnpm always resolves to an SSH URL (`git@github.com:…`) — even
# when the specifier is written as `git+https://`. CI runners have no SSH key, so
# every job that installs viewer dependencies dies with "Permission denied
# (publickey)". design-kit is a public, script-free asset package, so the fix is
# to fetch it as a plain HTTPS tarball pinned to the commit the lockfile already
# uses. That requires regenerating pnpm-lock.yaml, which in turn requires
# downloading the tarball — something a GitHub runner can do and the authoring
# environment could not.
name: One-shot — design-kit HTTPS tarball + lockfile

on:
  push:
    branches: [chore/design-kit-lockfile]

permissions:
  contents: read

env:
  TARGET_BRANCH: sync/upstream-2026-07-27
  # Same commit pnpm-lock.yaml already pins, so this is not a version bump.
  DESIGN_KIT_COMMIT: d41bbbb0472923d1cdc5104565a423898b7a7a1b

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync token is configured
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret UPSTREAM_SYNC_TOKEN is not set — needed to push the result."
            exit 1
          fi

      - name: Checkout the branch we are fixing
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite the specifier to an HTTPS tarball
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const p = "apps/viewer/package.json";
            const pkg = JSON.parse(readFileSync(p, "utf8"));
            const url = `https://github.com/AssetinSpace/design-kit/archive/${process.env.DESIGN_KIT_COMMIT}.tar.gz`;
            const before = pkg.dependencies["@assetinspace/design-kit"];
            if (!before) throw new Error("design-kit dependency not found");
            pkg.dependencies["@assetinspace/design-kit"] = url;
            writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log(`${before}\n  -> ${url}`);
          '

      - name: Regenerate the lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify no SSH URL survives
        run: |
          if grep -q 'git@github.com' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml still contains an SSH URL — the fix did not take."
            grep -n 'git@github.com' pnpm-lock.yaml
            exit 1
          fi
          grep -q 'design-kit' pnpm-lock.yaml || {
            echo "::error::design-kit vanished from the lockfile."; exit 1; }
          echo "OK — design-kit resolves over HTTPS, no SSH URL left."

      - name: Commit and push
        run: |
          git config user.name "aim-upstream-sync[bot]"
          git config user.email "aim-upstream-sync@users.noreply.github.com"
          if git diff --quiet -- apps/viewer/package.json pnpm-lock.yaml; then
            echo "Nothing changed — already fixed."
            exit 0
          fi
          git add apps/viewer/package.json pnpm-lock.yaml
          git commit -m "fix(deps): fetch design-kit as an HTTPS tarball

          The \`github:\` shorthand makes pnpm resolve design-kit over SSH
          (\`repo: git@github.com:…\` in the lockfile) regardless of how the
          specifier is written — verified against an empty pnpm store. CI runners
          have no SSH key, so every job installing viewer dependencies failed with
          \"Permission denied (publickey)\", and so did the Vercel install.

          design-kit is public and has no build scripts (css, tokens.json, assets
          only), so a plain HTTPS tarball works and needs no key, token or CI
          change. Pinned to ${DESIGN_KIT_COMMIT} — the commit the lockfile already
          resolved to, so this is not a version bump.

          Generated by a one-shot workflow: the authoring environment could not
          reach github.com over HTTPS to compute the tarball integrity hash."
          git push origin HEAD:"$TARGET_BRANCH"
